# frontend-deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: sun123testdoc/availability-frontend:latest
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: API_URL
              value: "http://backend:8000"
            - name: PUBLIC_BACKEND_URL
              value: "http://localhost:31501"
---
# NodePort service for external access to the frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 31500
---
# ClusterIP service for Prometheus scraping (metrics)
apiVersion: v1
kind: Service
metadata:
  name: frontend-metrics
  namespace: default
  labels:
    app: frontend
    component: metrics
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: metrics
      port: 9100
      targetPort: 5000
      protocol: TCP
---
# ServiceMonitor for Prometheus Operator (must be created in monitoring namespace)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-servicemonitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: frontend
      component: metrics
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
