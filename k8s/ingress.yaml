apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: availability-ingress
spec:
  rules:
  - host: availability.local
    http:
      paths:
      - path: /backend
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 5000
