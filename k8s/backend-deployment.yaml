# backend-deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /app/db /app/uploads
              chown -R 1000:1000 /app/db /app/uploads
          volumeMounts:
            - name: db-storage
              mountPath: /app/db
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: backend
          image: sun123testdoc/availability-backend:latest
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: db-storage
              mountPath: /app/db
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# NodePort service for external access to the backend
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 31501
---
# ClusterIP service for Prometheus scraping (metrics)
apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: default
  labels:
    app: backend
    component: metrics
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: metrics
      port: 9100
      targetPort: 8000
      protocol: TCP
---
# ServiceMonitor for Prometheus Operator (must be created in monitoring namespace)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-servicemonitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
      component: metrics
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
