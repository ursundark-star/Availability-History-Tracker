<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>About</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 900px; margin: 40px auto; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
        .header { display:flex; align-items:center; gap:16px; margin-bottom:12px; }
        .avatar { width:96px; height:96px; object-fit:cover; border-radius:8px; border:1px solid #e6e6e6; }
        .title { font-size:20px; font-weight:700; color:#222; }
        .sub { color:#666; font-size:14px; margin-top:6px; }
        .content { margin-top:14px; line-height:1.6; color:#333; white-space:pre-wrap; }
        .back { margin-top:18px; display:inline-block; color:#0d6efd; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            {% if avatar_url %}
                <img class="avatar" src="{{ avatar_url }}" alt="avatar">
            {% endif %}
            <div>
                <div class="title">About</div>
                <div class="sub">Detailed profile and history</div>
            </div>
        </div>

        <div class="content">
            {% if about %}
                {{ about }}
            {% else %}
                No detailed information available.
            {% endif %}
        </div>

        <a class="back" href="/">← Back to Home</a>
    </div>
</body>
</html>
