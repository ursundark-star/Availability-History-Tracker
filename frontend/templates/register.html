<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial; background: #f4f6f8; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { width: 480px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="box">
        <h2 class="text-center">Register</h2>
        <form method="POST" enctype="multipart/form-data" onsubmit="return validateForm(event);">
            <input type="text" id="username" name="username" class="form-control mb-2" placeholder="Username" required>
            <input type="password" id="password" name="password" class="form-control mb-2" placeholder="Password" required>
            <label>Photo</label>
            <input type="file" name="photo" accept="image/*" class="form-control mb-2" required>
            <label>Short Description</label>
            <textarea name="description" rows="2" maxlength="250" class="form-control mb-2" placeholder="Short description"></textarea>
            <label>About Us Detailed</label>
            <textarea name="about_us" rows="5" maxlength="2000" class="form-control mb-2" placeholder="Detailed about information"></textarea>
            <input type="submit" value="Register" class="btn btn-primary w-100">
        </form>
    </div>

    <!-- Bootstrap Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">Registration Error</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="errorMessage">
            <!-- Error message will be injected here -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function validateForm(event) {
            event.preventDefault(); // prevent default submit

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            // Password regex: min 8 chars, uppercase, lowercase, digit, special char
            const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

            if (!passwordPattern.test(password)) {
                showError("❌ Password must be at least 8 characters and include uppercase, lowercase, number, and special character.");
                return false;
            }

            // Duplicate username check (call backend /username)
            try {
                const resp = await fetch("/username");
                const data = await resp.json();
                if (data.username && data.username === username) {
                    showError("⚠️ Username already exists. Please choose another.");
                    return false;
                }
            } catch (e) {
                console.warn("Username check failed, continuing...");
            }

            // If validation passes, submit form
            event.target.submit();
        }

        function showError(message) {
            document.getElementById("errorMessage").innerText = message;
            const modal = new bootstrap.Modal(document.getElementById("errorModal"));
            modal.show();
        }
    </script>
</body>
</html>
