<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Document Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 18px; }
        .card { background: white; padding: 16px; border-radius: 8px; max-width: 1100px; margin: 18px auto; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
        .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
        .back { color:#0d6efd; text-decoration:none; font-weight:600; }
        .file-name { font-weight:700; color:#222; }
        .viewer { width:100%; height:80vh; border:1px solid #e6e6e6; border-radius:6px; background:#fff; display:flex; align-items:center; justify-content:center; overflow:auto; }
        iframe { width:100%; height:100%; border:0; }
        img { max-width:100%; max-height:100%; display:block; margin:0 auto; }
        .download { padding:8px 12px; background:#0d6efd; color:white; border-radius:6px; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="toolbar">
            <div>
                <a class="back" href="/">← Back</a>
            </div>
            <div class="file-name">Document</div>
            <div>
                <a class="download" href="{{ file_url }}" target="_blank" rel="noopener noreferrer">Open / Download</a>
            </div>
        </div>

        <div class="viewer">
            {% if mime_type == "application/pdf" %}
                <iframe src="{{ file_url }}"></iframe>
            {% elif mime_type.startswith("image/") %}
                <img src="{{ file_url }}" alt="Document image">
            {% else %}
                <div style="padding:20px; text-align:center;">
                    <p>This file type cannot be previewed in the browser.</p>
                    <p><a class="download" href="{{ file_url }}" target="_blank" rel="noopener noreferrer">Download file</a></p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
