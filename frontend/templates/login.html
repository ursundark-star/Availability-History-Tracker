<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial; background: #f9f9f9; text-align: center; margin-top: 50px; }
        form { display: inline-block; background: white; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { margin: 5px; padding: 8px; width: 90%; }
        input[type="submit"] { background: #007BFF; color: white; border: none; cursor: pointer; }
        input[type="submit"]:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>Login</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username"><br>
        <input type="password" name="password" placeholder="Password"><br>
        <input type="submit" value="Login">
    </form>
    <p><a href="/register">Register</a></p>
</body>
</html>
