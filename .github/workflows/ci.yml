name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4   # updated for Node.js 24

    - name: Set up Python
      uses: actions/setup-python@v5   # updated for Node.js 24
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else echo "No requirements.txt found"; fi

    - name: Run tests
      run: |
        if [ -f requirements.txt ]; then pytest || echo "Tests failed or not found"; else echo "No tests"; fi

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build backend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/availability-backend:latest ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/availability-backend:latest
    - name: Build frontend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/availability-frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/availability-frontend:latest

