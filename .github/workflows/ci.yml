name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/availability-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/availability-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/availability-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/availability-frontend:latest

      - name: Deploy to Kubernetes
        env:
          BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/availability-backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/availability-frontend:${{ github.sha }}
        run: |
          kubectl set image deployment/backend backend=${BACKEND_IMAGE} --record
          kubectl set image deployment/frontend frontend=${FRONTEND_IMAGE} --record
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
