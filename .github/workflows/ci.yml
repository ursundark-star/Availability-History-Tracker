name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/availability-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/availability-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/availability-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/availability-frontend:latest

      - name: Deploy to Kubernetes
        env:
          BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/availability-backend:${{ env.IMAGE_TAG }}
          FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/availability-frontend:${{ env.IMAGE_TAG }}
        run: |
          kubectl set image deployment/backend backend=${BACKEND_IMAGE} --record
          kubectl set image deployment/frontend frontend=${FRONTEND_IMAGE} --record
          kubectl rollout status deployment/backend --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
