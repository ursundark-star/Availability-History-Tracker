name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Debug step (optional) - confirms secrets are injected
      - name: Debug secrets
        run: |
          echo "Username: ${{ secrets.DOCKER_USERNAME }}"
          echo "Password length: ${#${{ secrets.DOCKER_PASSWORD }}}"

      - name: Log in to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$PASSWORD" | docker login -u "$USERNAME" --password-stdin

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/availability-backend:${{ github.sha }} ./backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/availability-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/availability-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/availability-backend:latest

      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/availability-frontend:${{ github.sha }} ./frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/availability-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/availability-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/availability-frontend:latest

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/availability-backend:${{ github.sha }}
          kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/availability-frontend:${{ github.sha }}
          kubectl rollout status deployment/backend
          kubectl rollout status deployment/frontend
