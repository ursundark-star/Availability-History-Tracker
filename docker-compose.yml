version: "3"
services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8001:8000"   # host:container mapping
    restart: always   # optional: auto-restart if container stops

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:5000"   # host:container mapping
    depends_on:
      - backend
    restart: always   # optional: auto-restart if container stops
